<div id="wl-root"></div>
<style>
#wl-root{min-height:70vh}
#wl-loader{position:fixed;inset:0;z-index:2147483600;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(900px 520px at 30% -10%,#2a1d0f 0%,#0b0a08 60%) #0b0a08;color:#f3ece0;font:15px/1.5 Inter,system-ui,-apple-system,sans-serif;transition:opacity .55s ease,visibility .55s}
#wl-loader.fin{opacity:0;visibility:hidden}
.wll-in{width:min(780px,100%);text-align:center}
.wll-logo{font:800 17px ui-monospace,'JetBrains Mono',monospace;letter-spacing:.24em;color:#00ff77;text-shadow:0 0 18px rgba(0,255,119,.45);margin-bottom:18px}
.wll-logo small{display:block;margin-top:4px;font:500 12px Inter,system-ui,sans-serif;letter-spacing:.06em;color:rgba(243,236,224,.55);text-shadow:none}
.wll-plan{width:100%;height:auto;overflow:visible}
.wll-plan .cor{fill:#14100b;opacity:0;animation:wllfade .5s .1s forwards}
.wll-plan .rm rect{fill:rgba(255,190,90,.035);stroke:rgba(255,190,90,.38);stroke-width:1.2;stroke-dasharray:520;stroke-dashoffset:520;animation:wlldraw .9s var(--d) ease-out forwards}
.wll-plan .rm text{font:600 6.5px ui-monospace,monospace;letter-spacing:.12em;fill:rgba(243,236,224,.45);opacity:0;animation:wllfade .4s calc(var(--d) + .5s) forwards}
.wll-plan .pp{transform:translate(260px,130px) scale(.4);opacity:0;animation:wllwalk .85s var(--d) cubic-bezier(.3,.7,.2,1) forwards}
.wll-plan .pp circle{fill:#2a2116;stroke:rgba(0,255,119,.55);stroke-width:1}
.wll-plan .pp text{font-size:14px;text-anchor:middle}
.wll-plan .pp .dk{fill:#3a2c1d;opacity:0;animation:wllfade .3s calc(var(--d) + .6s) forwards}
.wll-plan .pp .on{fill:#00ff77;stroke:none;opacity:0;animation:wllfade .3s calc(var(--d) + .8s) forwards,wllpulse 1.6s calc(var(--d) + 1.1s) ease-in-out infinite}
.wll-bar{margin:20px auto 10px;width:min(320px,80%);height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.wll-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#00b856,#00ff77);box-shadow:0 0 12px rgba(0,255,119,.6);animation:wllprog 3.4s cubic-bezier(.2,.6,.3,1) forwards}
#wl-loader.pret .wll-bar i{width:100%!important;animation:none;transition:width .3s}
.wll-txt{min-height:1.5em;color:rgba(243,236,224,.7);font-size:14px;transition:opacity .25s}
@keyframes wlldraw{to{stroke-dashoffset:0}}
@keyframes wllfade{to{opacity:1}}
@keyframes wllwalk{0%{opacity:0;transform:translate(260px,130px) scale(.4)}25%{opacity:1}100%{opacity:1;transform:translate(var(--x),var(--y)) scale(1)}}
@keyframes wllpulse{50%{opacity:.35}}
@keyframes wllprog{0%{width:0}60%{width:72%}100%{width:90%}}
@media (prefers-reduced-motion:reduce){.wll-plan *{animation-duration:.01s!important;animation-delay:0s!important}}
.wl-boot{position:fixed;inset:0;z-index:2147483600;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:24px;background:#0b0a08;color:rgba(243,236,224,.75);font:16px/1.5 system-ui,-apple-system,sans-serif}
.wl-boot b{color:#00ff77;letter-spacing:.2em;font-family:ui-monospace,monospace}
.wl-boot a{display:inline-block;margin-top:6px;padding:10px 18px;border-radius:12px;background:rgba(0,255,119,.12);border:1px solid rgba(0,255,119,.45);color:#bfffdc;text-decoration:none}
</style>
<script>
(function () {
  // Writinglab — petit chargeur. L'application et toutes les données passent par le webhook n8n
  // « Posthumain — Writinglab (la rédaction) », qui vérifie d'abord le compte membre Ghost connecté.
  var API = 'https://trustmedias.app.n8n.cloud/webhook/writinglab';
  var root = document.getElementById('wl-root');
  // Écran de chargement unique : la rédaction se dessine et chacun rejoint son bureau, jusqu'au premier affichage complet du lab.
  var L = document.getElementById('wl-loader'), T = document.getElementById('wll-txt');
  var ETAPES = ['Les lumières s’allument…', 'La Secrétaire range ses dossiers…', 'L’Assistant ouvre la bibliothèque…', 'Le Courrier relève les boîtes…', 'Le Marbre charge les brouillons…', 'Le Comptable compte ses pièces…', 'Tout le monde rejoint son bureau…'];
  var k = 0, tick = setInterval(function () { if (!T) return; k = Math.min(k + 1, ETAPES.length - 1); T.style.opacity = 0; setTimeout(function () { T.textContent = ETAPES[k]; T.style.opacity = 1; }, 220); }, 950);
  window.WL_LOADER = {
    etape: function (t) { if (T) T.textContent = t; },
    fin: function () { clearInterval(tick); if (!L) return; if (T) T.textContent = 'La rédaction est prête.'; L.classList.add('pret'); setTimeout(function () { L.classList.add('fin'); }, 350); setTimeout(function () { if (L.parentNode) L.parentNode.removeChild(L); }, 1000); }
  };
  function msg(html) { window.WL_LOADER.fin(); root.innerHTML = '<div class="wl-boot"><b>WRITINGLAB</b>' + html + '</div>'; }
  // jeton d'identité du membre Ghost connecté (redemandé à chaque appel : il ne vit que quelques minutes)
  function token() {
    return fetch('/members/api/session', { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.text() : ''; })
      .catch(function () { return ''; });
  }
  function call(params) {
    return token().then(function (t) {
      if (!t) throw { why: 'non connecté' };
      var body = new URLSearchParams();
      body.set('token', t);
      Object.keys(params || {}).forEach(function (k) { body.set(k, params[k]); });
      return fetch(API, { method: 'POST', body: body }).then(function (r) {
        return r.json().catch(function () { return { ok: false, why: 'réponse illisible (' + r.status + ')' }; });
      });
    });
  }
  call({ mode: 'app' }).then(function (res) {
    if (!res || !res.ok) {
      msg(res && res.why === 'accès réservé' ? '<div>🔒 Cet espace est réservé à la rédaction.</div>' : '<div>⚠️ ' + ((res && res.why) || 'indisponible') + '</div>');
      return;
    }
    var s = document.createElement('script');
    s.textContent = res.app;
    document.body.appendChild(s);
    window.WRITINGLAB_START({ root: root, call: call });
  }).catch(function (e) {
    if (e && e.why === 'non connecté') msg('<div>🔒 Cet espace est réservé à la rédaction.</div><a href="#/portal/signin" data-portal="signin">Se connecter</a>');
    else msg('<div>⚠️ La rédaction ne répond pas. Réessayez dans un instant.</div>');
  });
})();
</script>
