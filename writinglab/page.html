<div id="wl-root"><div class="wl-boot">📰 La rédaction s’allume…</div></div>
<style>
#wl-root{min-height:70vh}
.wl-boot{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:24px;background:#0b0a08;color:rgba(243,236,224,.75);font:16px/1.5 system-ui,-apple-system,sans-serif}
.wl-boot b{color:#00ff77;letter-spacing:.2em;font-family:ui-monospace,monospace}
.wl-boot a{display:inline-block;margin-top:6px;padding:10px 18px;border-radius:12px;background:rgba(0,255,119,.12);border:1px solid rgba(0,255,119,.45);color:#bfffdc;text-decoration:none}
</style>
<script>
(function () {
  // Writinglab — petit chargeur. L'application et toutes les données passent par le webhook n8n
  // « Posthumain — Writinglab (la rédaction) », qui vérifie d'abord le compte membre Ghost connecté.
  var API = 'https://trustmedias.app.n8n.cloud/webhook/writinglab';
  var root = document.getElementById('wl-root');
  function msg(html) { root.innerHTML = '<div class="wl-boot"><b>WRITINGLAB</b>' + html + '</div>'; }
  // jeton d'identité du membre Ghost connecté (redemandé à chaque appel : il ne vit que quelques minutes)
  function token() {
    return fetch('/members/api/session', { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.text() : ''; })
      .catch(function () { return ''; });
  }
  function call(params) {
    return token().then(function (t) {
      if (!t) throw { why: 'non connecté' };
      var body = new URLSearchParams();
      body.set('token', t);
      Object.keys(params || {}).forEach(function (k) { body.set(k, params[k]); });
      return fetch(API, { method: 'POST', body: body }).then(function (r) {
        return r.json().catch(function () { return { ok: false, why: 'réponse illisible (' + r.status + ')' }; });
      });
    });
  }
  call({ mode: 'app' }).then(function (res) {
    if (!res || !res.ok) {
      msg(res && res.why === 'accès réservé' ? '<div>🔒 Cet espace est réservé à la rédaction.</div>' : '<div>⚠️ ' + ((res && res.why) || 'indisponible') + '</div>');
      return;
    }
    var s = document.createElement('script');
    s.textContent = res.app;
    document.body.appendChild(s);
    window.WRITINGLAB_START({ root: root, call: call });
  }).catch(function (e) {
    if (e && e.why === 'non connecté') msg('<div>🔒 Cet espace est réservé à la rédaction.</div><a href="#/portal/signin" data-portal="signin">Se connecter</a>');
    else msg('<div>⚠️ La rédaction ne répond pas. Réessayez dans un instant.</div>');
  });
})();
</script>
