<script>
/* Writinglab — page Ghost /writinglab (publiée par « 🛠️ Publier la page Writinglab » du workflow n8n, à relancer si ce fichier change).
   Mode clair / sombre : le lab est une application isolée du thème du site (jamais « white-mode », le clair est signalé par
   « ph-clair » sur <html> ; même réglage que le site : cookie tlj_theme).
   Modules partagés avec le Videolab (dépôt posthumain-ghost-assets, dossier shared/), épinglés sur UNE même version (le même
   commit dans les deux balises ci-dessous ; shared/README.md explique comment la changer) :
   - shared/theme-mode.js : mode clair / sombre ;   - shared/lab-boot.js : écran de chargement + appels au webhook + lancement.
   (shared/lab-core.js, les briques de l'application, arrive avec l'application par le webhook, toujours à jour.) */
(function () { var h = document.documentElement; try { var w = /(?:^|;\s*)tlj_theme=white/.test(document.cookie); h.classList.remove('white-mode'); h.classList.toggle('ph-clair', w); } catch (e) {} })();
</script>
