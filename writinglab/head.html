<!-- Posthumain — en-tête des pages-applications des labs (« Code injection > Header » de la page Ghost writinglab ; le Videolab a le sien dans le dépôt posthumain-motion ;
     à recopier là si ce fichier change). 22/10/2026.
     1) Masque le thème Ghost dès le premier octet (pas de flash d'article avant l'écran de chargement du lab).
     2) Mode clair : le lab n'a jamais la classe « white-mode » (elle force fond blanc / texte noir sur toute la page et cassait
        le lab) ; le mode clair est signalé par « ph-clair » sur <html>, d'après le même réglage que le site (cookie tlj_theme). -->
<style id="phl-voile">
html{background:#0b0a08}html.ph-clair{background:#f6f2ea}
html::before{content:"";position:fixed;inset:0;z-index:3998999;background:inherit}
html,body{overflow:hidden!important}
</style>
<script>
(function () {
  var h = document.documentElement;
  function f() {
    try {
      var w = /(?:^|;\s*)tlj_theme=white/.test(document.cookie);
      if (h.classList.contains('white-mode')) h.classList.remove('white-mode');
      if (!window.PHTheme && h.classList.contains('ph-clair') !== w) h.classList.toggle('ph-clair', w);
    } catch (e) {}
  }
  f();
  try { new MutationObserver(f).observe(h, { attributes: true, attributeFilter: ['class'] }); } catch (e) {}
})();
</script>
